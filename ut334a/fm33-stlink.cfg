# UNI-T UT334A / Fudan FM33LC043N - READ-ONLY SWD access via ST-Link (OpenOCD 0.12+)
#
# Wiring (leave the ST-Link 3.3V pin UNCONNECTED, run the board from its own battery):
#   ST-Link GND   -> pad 5 (GND)
#   ST-Link SWDIO -> pad 2 (QFN-32 pin 1, PD8/SWIO)
#   ST-Link SWCLK -> pad 3 (QFN-32 pin 32, PD7/SWCLK)
#   ST-Link RST   -> leave DISCONNECTED. Tested 2026-10-25: with connect_assert_srst, 139 attempts in
#                    20 s never connected, so the clone's RST does not pull NRST low on this board.
#                    Hold pad 1 (NRST, QFN-32 pin 2) to GND by hand (or with a push-button) instead.
#
# Why the odd setup:
#  - The stock firmware takes over PD7/PD8 at boot, so SWD only answers while NRST is held low.
#  - The core reports CPUID 0x410CC300, which OpenOCD's cortex_m target rejects ("Examination
#    failed"), so this uses a mem_ap target: plain memory reads over the AHB-AP, no core handling.
#  - To read flash you must stop the CPU at its reset vector before the firmware runs:
#    fm33_arm while NRST is held, then release NRST (datasheet section 36.5).
#
# Usage (ex. PlatformIO's OpenOCD; add -s <openocd>/openocd/scripts):
#   Hold NRST to GND, then within a few seconds run (retry until "ARMED" appears):
#     openocd -f fm33-stlink.cfg -c "init; fm33_session"
#   Release NRST when it says ARMED. fm33_session checks protection, dumps only if
#   UNPROTECTED, then releases the core and exits.
#   Pieces: fm33_arm, fm33_wait_halt, fm33_protection, fm33_dump, fm33_release.
#
# There is deliberately NO flash bank in this file, so OpenOCD has no way to
# erase or write flash. The only writes are to the volatile core debug registers
# DHCSR/DEMCR (cleared by power-on reset). Never answer "yes" to any tool offering
# to unlock, unsecure or remove protection: on the FM33LC that triggers a full chip erase.

source [find interface/stlink.cfg]
transport select swd
adapter speed 200

source [find target/swj-dp.tcl]
set _CHIPNAME fm33lc0
swj_newdap $_CHIPNAME cpu -expected-id 0x0bb11477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.mem mem_ap -endian little -dap $_CHIPNAME.dap -ap-num 0

set FM33_DHCSR 0xE000EDF0
set FM33_DEMCR 0xE000EDFC

proc fm33_rd32 {a} { return [lindex [read_memory $a 32 1] 0] }

# Decode LDT1 (0x1FFFFC00). OPTBYTES[7:0]=DBRDPEN (0xAA = debug read protection off),
# OPTBYTES[15:8]=ACLKEN (0x33 = ACLOCK off); upper halfword is the complement.
proc fm33_decode {bytes} {
    set hex {}
    foreach b $bytes { lappend hex [format %02X $b] }
    echo "Option bytes @0x1FFFFC00: [join $hex { }]"
    set head [join [lrange $hex 0 3] { }]
    if {$head eq "AA 33 55 CC"} {
        echo ">>> UNPROTECTED: flash can be dumped."
        return 1
    } elseif {[lindex $hex 0] ne "AA"} {
        echo ">>> PROTECTED (DBRDPEN != 0xAA): SWD cannot read flash. Do NOT unlock (it erases the chip)."
    } else {
        echo ">>> UNKNOWN pattern (ACLOCK may be on): send these bytes before doing anything else."
    }
    return 0
}

# Only meaningful while the core is halted (reads return 0 while it is held in reset).
proc fm33_protection {} {
    set ok [fm33_decode [read_memory 0x1FFFFC00 8 16]]
    set uid {}
    foreach b [read_memory 0x1FFFFA10 8 12] { lappend uid [format %02X $b] }
    echo "Chip UID @0x1FFFFA10: [join $uid {}]"
    echo "ACLOCK words @0x1FFFFC08: [read_memory 0x1FFFFC08 32 2]"
    return $ok
}

# Run while NRST is held low: enable halting debug and vector catch on core reset.
proc fm33_arm {} {
    global FM33_DHCSR FM33_DEMCR
    write_memory $FM33_DHCSR 32 0xA05F0001
    write_memory $FM33_DEMCR 32 [expr {[fm33_rd32 $FM33_DEMCR] | 1}]
    echo ">>> ARMED. Release NRST now."
}

# Wait (up to timeout_ms) for the core to halt at the reset vector after NRST is released.
proc fm33_wait_halt {{timeout_ms 90000}} {
    global FM33_DHCSR
    for {set t 0} {$t < $timeout_ms} {incr t 100} {
        if {![catch {set d [fm33_rd32 $FM33_DHCSR]}]} {
            # S_HALT = bit17; S_RESET_ST = bit25 is sticky, so read twice
            if {($d & 0x20000) && !([fm33_rd32 $FM33_DHCSR] & 0x2000000)} {
                echo ">>> HALTED at reset vector."
                return 1
            }
        }
        sleep 100
    }
    echo ">>> Timed out waiting for the core to halt."
    return 0
}

# Clear vector catch and halting debug; the firmware runs on.
proc fm33_release {} {
    global FM33_DHCSR FM33_DEMCR
    write_memory $FM33_DEMCR 32 [expr {[fm33_rd32 $FM33_DEMCR] & ~1}]
    write_memory $FM33_DHCSR 32 0xA05F0000
    echo ">>> Released core."
}

# Dump flash three times plus the readable info area (0x1FFFF000-0x1FFFF9FF bus-faults) and RAM.
# Core must be halted.
proc fm33_dump {} {
    foreach n {1 2 3} {
        dump_image ut334a_stock_$n.bin 0x00000000 0x40000
        echo "Wrote ut334a_stock_$n.bin"
    }
    dump_image ut334a_info_1FFFFA00-1FFFFFFF.bin 0x1FFFFA00 0x600
    dump_image ut334a_ram.bin 0x20000000 0x6000
    echo "Done. Compare the three flash files (sha256sum) - they must be identical."
}

proc fm33_session {} {
    fm33_arm
    if {[fm33_wait_halt]} {
        if {[catch {
            if {[fm33_protection]} { fm33_dump }
        } e]} { echo "Error: $e" }
    }
    fm33_release
    shutdown
}
